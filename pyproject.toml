[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier"
version = "1.1.0"
description = "OPSEC-focused risk analysis of Chrome, Edge and Firefox extensions, with a self-contained HTML report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
dossier = "dossier.cli:main"

[tool.setuptools]
packages = ["dossier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads real extensions from the stores (run with --network)"]
