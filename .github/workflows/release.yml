name: Release

# Push a tag like v1.1.0 to build standalone binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dossier-windows-x64.zip
          - os: ubuntu-22.04        # older glibc = runs on more distros
            asset: dossier-linux-x64.tar.gz
          - os: macos-latest        # Apple Silicon
            asset: dossier-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[llm,dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build binary
        run: pyinstaller --onefile --name dossier --collect-data certifi --noconfirm packaging/dossier_entry.py
      - name: Smoke test binary
        shell: bash
        run: |
          ./dist/dossier --version
          ./dist/dossier examples/demo-risky-extension --no-llm --no-history -o smoke -q
          ls smoke/*.html
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/dossier.exe, README.md, .env.example -DestinationPath ${{ matrix.asset }}
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp README.md .env.example dist/
          tar -czf ${{ matrix.asset }} -C dist dossier README.md .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "Dossier ${{ github.ref_name }}" \
            --generate-notes
